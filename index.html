<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>苏州到五指山自驾</title>
<meta name="description" content="2026 年 12 月，从苏州沿海岸线开车回五指山：路线地图、逐日日程、每站景点和图表。">
<meta name="theme-color" content="#efe9e0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232e5b44'/><path d='M9 21c4-1 5-9 8-9s3 6 6 6' stroke='%23efe9e0' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  /* 陶土 · 松绿；类别色已用 dataviz 校验脚本验证（色盲区分、对比度） */
  --bg:#efe9e0; --panel:#f7f3ec; --chip:#e2d9cb; --line:#dcd2c2; --ink:#22261f; --muted:#5f6158;
  --accent:#2e5b44; --taikang:#2e5b44; --hotel:#4a6178; --ferry:#2f7f9a; --home:#b07a1f; --warn:#a8452a;
  --elder:#b0562a; --young:#2a73a8; --both:#8a8a1a; --geo:#2b2b2b;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:180ms;
  --shadow:0 1px 2px rgba(34,38,31,.06),0 6px 20px rgba(34,38,31,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1d19; --panel:#23261f; --chip:#2e3128; --line:#383b32; --ink:#ece6da; --muted:#a5a497;
  --accent:#6fae8c; --taikang:#6fae8c; --hotel:#8fa6c0; --ferry:#6bb5cf; --home:#e0b04a; --warn:#e08a5c;
  --elder:#c9744a; --young:#4f8fcb; --both:#9a9a2e; --geo:#e8e2d6; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:420px 1fr;height:100vh;height:100dvh}
#panel{overflow-y:auto;border-right:1px solid var(--line);padding:0 22px 40px}
#map{height:100%;background:var(--bg)}
.leaflet-tile-pane{filter:sepia(.16) saturate(.82) contrast(.97)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.8) sepia(.1) saturate(.8)} }
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:26px;line-height:1.25}
h2{font-size:24px;line-height:1.2}
h3{font-size:15px;margin:22px 0 8px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
/* 顶部标签 */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding:14px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.tabs a{flex:1;text-align:center;text-decoration:none;padding:7px 0;border-radius:99px;font-size:14px;color:var(--muted);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.tabs a:hover{background:var(--chip);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent);color:#fff}
.stats{display:flex;gap:8px;margin:16px 0 4px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.stat b{display:block;font:700 20px/1.2 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* 路线列表 */
.route{list-style:none;margin:18px 0 0;padding:0}
.leg{font-size:12.5px;color:var(--muted);padding:3px 0 3px 40px;position:relative;font-variant-numeric:tabular-nums}
.leg::before{content:"";position:absolute;left:15px;top:0;bottom:0;border-left:2px dotted var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0;
  transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
button.row:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
button.row:active{transform:translateY(0) scale(.99)}
.row.plain{background:transparent;border-style:dashed}
.num{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 13px/1 var(--sans)}
.t-taikang{background:var(--taikang)} .t-hotel{background:var(--hotel)} .t-ferry{background:var(--ferry)} .t-home{background:var(--home)}
.row .main{flex:1;min-width:0}
.row .city{font:700 17px/1.3 var(--serif);display:block}
.row .base{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .when{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .when b{display:block;color:var(--ink);font-weight:600}
.chev{color:var(--muted);font-size:20px;line-height:1}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
summary{cursor:pointer;font-family:var(--serif);font-weight:700}
details ul{padding-left:18px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:24px}
/* 城市页 */
.nav{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:8px}
.pill{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;text-decoration:none;transition:border-color var(--dur) var(--ease)}
.pill:hover{border-color:var(--accent)}
.nav .pn{display:flex;gap:6px}
.poster{display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow);background:#000;cursor:zoom-in}
.poster img{display:block;width:100%;height:auto;transition:transform 600ms var(--ease)}
.poster:hover img{transform:scale(1.02)}
.badge{display:inline-block;font:500 11.5px/1.6 var(--sans);padding:0 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:8px;vertical-align:4px}
.meta{font-size:13.5px;color:var(--muted);margin-top:6px}
.meta div{margin-top:2px}
.note{margin:14px 0 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:13px;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.filters button:hover{border-color:var(--accent)}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters small{opacity:.7;margin-left:4px}
.spot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.spot:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.spot.hl{border-color:var(--accent);box-shadow:var(--shadow)}
.spot .name{font-weight:600}
.spot .tip{font-size:13.5px;color:var(--muted);margin-top:2px}
.geo{font-size:13.5px;border-left:3px solid var(--geo);padding:1px 0 1px 9px;margin:7px 0 2px}
.chip{display:inline-block;font:500 11px/1.65 var(--sans);padding:0 6px;border-radius:4px;color:#fff;margin-right:5px;vertical-align:1px}
.w-elder{background:var(--elder)} .w-young{background:var(--young)} .w-both{background:var(--both)}
.w-geo{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--geo)}
.foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;flex-wrap:wrap}
.dist{font-variant-numeric:tabular-nums}
.dist span{color:var(--muted)}
.links{display:flex;gap:6px}
.links a{text-decoration:none;padding:2px 10px;border-radius:99px;border:1px solid var(--line);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.links a:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.links a.xhs{color:#e0243f} .links a.xhs:hover{background:#e0243f;border-color:#e0243f;color:#fff}
/* 日程 */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin:12px 0;scroll-margin-top:70px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.day.on{border-color:var(--accent);box-shadow:var(--shadow)}
.day header{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.day .dn{font:700 13px/1 var(--sans);color:#fff;background:var(--accent);border-radius:6px;padding:4px 6px;flex:none}
.day .dt{font:700 17px/1.3 var(--serif)}
.day .dc{color:var(--muted);font-size:13px}
.day .sum{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.day .sum.long{color:var(--warn);font-weight:600}
.items{list-style:none;margin:8px 0 0;padding:0}
.it{display:grid;grid-template-columns:44px 22px 1fr;gap:0 8px;align-items:start;padding:5px 0}
.it .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.it .pin{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);color:#fff;background:var(--accent);margin-top:1px}
.it .pin.none{background:transparent;border:2px solid var(--line);width:12px;height:12px;margin:5px 4px 0}
.it .what{font-size:14.5px}
.it .what b{font-weight:600}
.it .what small{color:var(--muted);font-size:12.5px;margin-left:6px}
.it .what div{color:var(--muted);font-size:13px}
.it .kmeet{font-style:normal;font-size:12px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:1px}
.hop{display:grid;grid-template-columns:44px 22px 1fr;gap:0 8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hop span:nth-child(2){border-left:2px dotted var(--line);margin-left:10px;min-height:22px}
.hop a{color:var(--muted)}
/* 图表 */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin:14px 0;position:relative}
.chart h3{margin:0 0 2px}
.chart .cap{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart svg .lab{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{transition:opacity var(--dur) var(--ease)}
.chart svg:hover .bar{opacity:.55}
.chart svg .g:hover .bar{opacity:1}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin:0 0 6px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ttip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12.5px;line-height:1.5;padding:6px 9px;border-radius:8px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity 120ms;z-index:3}
.chart details{margin-top:8px;padding-top:6px;font-size:12.5px}
.chart table{border-collapse:collapse;width:100%;margin-top:6px;font-variant-numeric:tabular-nums}
.chart td,.chart th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
/* 海报弹层 */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(92vw,560px);max-height:92vh;overflow:visible}
dialog.lb::backdrop{background:rgba(0,0,0,.78)}
dialog.lb img{display:block;max-width:100%;max-height:88vh;border-radius:10px}
dialog.lb .x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.4)}
/* 地图标记 */
.mk{border-radius:50%;color:#fff;font:700 12px/1 var(--sans);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.mk.dim{opacity:.45}
.mk.on{transform:scale(1.25)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.4)}
.dmk{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font:700 11px/22px var(--sans);text-align:center;border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-popup-content{font:13.5px/1.55 var(--sans);margin:10px 14px}
.leaflet-popup-content b{font-family:var(--serif)}
/* ---- 手机：整页滚动、底部导航、大字号、大按钮（长辈用手机看） ---- */
.bnav,.tomap,.showday{display:none}
@media (max-width:820px){
  body{font-size:17px;line-height:1.7}
  .app{display:block;height:auto}
  #map{height:38vh;min-height:240px;border-bottom:1px solid var(--line)}
  #panel{overflow:visible;border:0;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
  .tabs{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;text-decoration:none;color:var(--muted);font-size:15px;border-radius:12px}
  .bnav a span{font-size:20px;line-height:1.1}
  .bnav a[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--chip)}
  .tomap{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1000;border:0;border-radius:99px;padding:12px 18px;background:var(--ink);color:var(--panel);font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .tomap.show{display:block}
  h1{font-size:26px} h2{font-size:25px} h3{font-size:18px}
  .sub,.meta,.it .what div,.spot .tip,.geo,.day .dc,.hop,.leg,.row .base,.row .when,.foot2,.cap{font-size:15px}
  .stat b{font-size:22px} .stat span{font-size:13px}
  .row{padding:14px 14px;min-height:64px} .row .city{font-size:19px}
  .pill,.filters button,.links a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-size:16px}
  .links{gap:8px}
  .nav{margin:14px 0}
  .spot{padding:14px 15px} .spot .name{font-size:17px}
  .chip{font-size:13px;padding:1px 7px}
  .day{padding:14px 14px 12px;scroll-margin-top:12px}
  .day header{flex-wrap:wrap;row-gap:6px}
  .day .dt{font-size:19px}
  .day .sum{margin-left:0;width:100%;font-size:15px}
  .it{grid-template-columns:50px 26px 1fr;padding:7px 0}
  .it .tm{font-size:15px}
  .it .pin{width:24px;height:24px;font-size:13px}
  .it .what{font-size:17px}
  .hop{grid-template-columns:50px 26px 1fr;padding:2px 0}
  .hop a{display:inline-block;padding:8px 4px;margin:-8px 0}
  .showday{display:inline-flex}
  .it .what small{display:block;margin-left:0;font-size:14px}
  .chart svg text{font-size:12px}
  details{font-size:15px} summary{padding:8px 0}
  dialog.lb{max-width:96vw}
  dialog.lb .x{top:8px;right:8px;width:48px;height:48px;font-size:26px}
  .leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important}
}
@media print{
  .app{display:block;height:auto} #map,.tabs,.toolbar button,.poster,.links{display:none!important}
  #panel{overflow:visible;border:0} .day{break-inside:avoid;box-shadow:none}
  body{background:#fff;color:#000}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <main id="panel" aria-live="polite"></main>
  <div id="map" role="application" aria-label="行程地图"></div>
</div>
<nav class="bnav" id="bnav" aria-label="页面"><a href="#/"><span>🗺</span>路线</a><a href="#/days"><span>📅</span>日程</a><a href="#/charts"><span>📊</span>图表</a></nav>
<button class="tomap" id="tomap">↑ 看地图</button>
<dialog class="lb" id="lb" aria-label="城市海报"><button class="x" id="lbx" aria-label="关闭">×</button><img id="lbimg" alt=""></dialog>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="trip-data.js?v=10"></script>
<script src="schedule.js?v=10"></script>
<script src="generated.js?v=10"></script>
<script>
(function(){
const T = window.TRIP, G = window.GEN || {legs:{},dist:{},days:{}}, SCH = window.SCHEDULE || [];
const S = T.stops, $ = s => document.querySelector(s), enc = encodeURIComponent;
const byId = Object.fromEntries(S.map(s=>[s.id,s]));
const WHO = {elder:'历史人文', young:'风景休闲', both:'两者都有'};
const WD = '日一二三四五六';

// ---- 日期 ----
const start = new Date(T.startDate+'T00:00:00');
const md = d => (d.getMonth()+1)+'/'+d.getDate();
const dOf = str => new Date(str+'T00:00:00');
let off = 0;
S.forEach(s => { s._in = new Date(start); s._in.setDate(start.getDate()+off); off += s.nights||0; s._out = new Date(start); s._out.setDate(start.getDate()+off); });
const end = S[S.length-1]._in;
const cities = S.filter(s => s.spots && s.spots.length);
const leg = s => G.legs[s.id] || (s.drive && {km:s.drive.km, h:s.drive.h});
const driveKm = S.reduce((a,s)=>{ const l=G.legs[s.id]; return a + (l && !l.ferry ? l.km : 0); },0);
const dayDrive = d => { const g=G.days[d]; if(!g) return {min:0,km:0}; return g.hops.reduce((a,h)=>h.ferry?a:{min:a.min+h.min,km:a.km+h.km},{min:0,km:0}); };
const fmtH = m => m<60 ? m+' 分钟' : (Math.round(m/6)/10)+' 小时';

// ---- 链接 ----
const xhs = q => `https://www.xiaohongshu.com/search_result?keyword=${enc(q)}`;
const nav = (a,an,b,bn) => `https://uri.amap.com/navigation?from=${a[0]},${a[1]},${enc(an)}&to=${b[0]},${b[1]},${enc(bn)}&mode=car&coordinate=gaode&callnative=1`;
const shortBase = s => s.type==='taikang' ? s.name.replace('泰康之家·','') : '住处';
const who = p => p.who || 'both';
const match = (p,w) => w==='all' || (w==='geo' ? !!p.geo : who(p)===w || who(p)==='both');

// ---- 地图 ----
const map = L.map('map',{zoomControl:false});
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
const ll = p => [p[1],p[0]];
const css = v => getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();
const routeLayer = L.layerGroup().addTo(map), spotLayer = L.layerGroup().addTo(map), stopMk = {};
S.forEach((s,i)=>{ if(!i) return; const l=G.legs[s.id]; const path=(l&&l.path)||[S[i-1].lnglat,s.lnglat];
  L.polyline(path.map(ll),{color:css(l&&l.ferry?'ferry':'accent'),weight:4,opacity:.85,dashArray:l&&l.ferry?'6 8':null}).addTo(routeLayer); });
S.forEach((s,i)=>{
  const icon = L.divIcon({className:'',html:`<div class="mk t-${s.type}" style="width:28px;height:28px">${s.type==='home'?'家':i}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
  stopMk[s.id] = L.marker(ll(s.lnglat),{icon,zIndexOffset:1000,title:s.city}).addTo(map)
    .on('click',()=> cities.includes(s) ? go(s.id) : L.popup().setLatLng(ll(s.lnglat)).setContent(`<b>${s.city}</b><br>${s.name}`).openOn(map));
});
function markActive(id){
  Object.entries(stopMk).forEach(([k,m])=>{ const el=m.getElement()&&m.getElement().firstChild; if(!el) return;
    el.classList.toggle('on',k===id); el.classList.toggle('dim',!!id && k!==id); });
}
const allBounds = () => L.latLngBounds(S.map(s=>ll(s.lnglat)));
function resetMap(){ markActive(null); spotLayer.clearLayers(); routeLayer.eachLayer(l=>l.setStyle({opacity:.85})); map.closePopup(); }

const tabs = cur => `<nav class="tabs" aria-label="页面">${[['','路线'],['days','日程'],['charts','图表']].map(([h,n])=>`<a href="#/${h}" ${cur===h?'aria-current="page"':''}>${n}</a>`).join('')}</nav>`;

// ---- 路线（总览） ----
function overview(){
  resetMap(); map.flyToBounds(allBounds(),{padding:[30,30],duration:.6});
  const [t1,t2] = T.title.split(' · ');
  let h = tabs('') + `<h1>${t1}</h1><div class="sub">${t2?t2+'<br>':''}${start.getFullYear()}.${md(start).replace('/','.')} 出发 · ${end.getFullYear()}.${md(end).replace('/','.')} 到家</div>
    <div class="stats"><div class="stat"><b>${Math.round((end-start)/864e5)+1}</b><span>天</span></div>
      <div class="stat"><b>${driveKm.toLocaleString()}</b><span>公里</span></div>
      <div class="stat"><b>${cities.length}</b><span>个城市</span></div></div><ol class="route">`;
  S.forEach((s,i)=>{
    const l = i && leg(s);
    if(l) h += `<li class="leg">${l.ferry?'⛴ 过琼州海峡 · 船上约 1.5–2 小时':`🚗 ${l.km} km · ${l.h} 小时`}</li>`;
    if(s.type==='ferry') return;
    const when = s.nights ? `<b>${md(s._in)} – ${md(s._out)}</b>${s.nights} 晚` : `<b>${md(s._in)}</b>${i?'到家':'出发'}`;
    const inner = `<span class="num t-${s.type}">${s.type==='home'?'家':i}</span><span class="main"><span class="city">${s.city}</span><span class="base">${s.name}</span></span><span class="when">${when}</span>`;
    h += `<li>${cities.includes(s) ? `<button class="row" data-go="${s.id}">${inner}<span class="chev" aria-hidden="true">›</span></button>` : `<div class="row plain">${inner}</div>`}</li>`;
  });
  h += `</ol><details><summary>出发前要知道</summary><ul>${T.assumptions.concat(T.tips).map(t=>`<li>${t}</li>`).join('')}</ul></details>
    <div class="foot">路线和车程由 OpenStreetMap 路网预先算好，城市里的时间已加三成余量。底图 © 高德地图。城市海报仿照 maptoposter（MIT）的风格绘制，数据 © OpenStreetMap contributors，瓦片来自 OpenFreeMap。</div>`;
  show(h, '苏州到五指山自驾');
}

// ---- 城市 ----
let filter = 'all';
function city(s){
  const i = S.indexOf(s), ci = cities.indexOf(s), prev = cities[ci-1], next = cities[ci+1];
  const l = leg(s), from = S[i-1], D = G.dist[s.id] || [];
  const count = w => s.spots.filter(p=>match(p,w)).length;
  const F = [['all','全部'],['elder','历史人文'],['young','风景休闲'],['geo','地理']].filter(([w])=>count(w));
  if(!F.some(([w])=>w===filter)) filter='all';
  const nightDays = SCH.filter(d=>d.at===s.id).map(d=>d.d);
  let h = `<div class="nav"><a class="pill" href="#/">← 全程</a><span class="pn">
      ${prev?`<a class="pill" href="#/${prev.id}">‹ ${prev.city}</a>`:''}${next?`<a class="pill" href="#/${next.id}">${next.city} ›</a>`:''}</span></div>
    <button class="poster" data-poster="${s.id}" aria-label="查看${s.city}海报大图"><img src="posters/${s.id}.webp" alt="${s.city}街道海报" width="792" height="1056" onerror="this.parentNode.remove()"></button>
    <h2>${i}. ${s.city}${s.status?`<span class="badge">${s.status}</span>`:''}</h2>
    <div class="meta"><div>${md(s._in)}（周${WD[s._in.getDay()]}）– ${md(s._out)} · ${s.nights} 晚 · ${s.name}</div>
      ${s.addr?`<div>📍 ${s.addr}</div>`:''}
      ${l?`<div>🚗 从${from.city.split(' ')[0]}过来 ${l.km} km · ${l.h} 小时${s.drive&&s.drive.waypoints?' · '+s.drive.via:''} · <a href="${nav(from.lnglat,from.name,s.lnglat,s.name)}" target="_blank" rel="noopener">高德导航</a></div>`:''}</div>
    ${s.note?`<p class="note">${s.note}</p>`:''}
    ${nightDays.length?`<p><a class="pill" href="#/days/${nightDays[0]}">看这几天的分时日程 →</a></p>`:''}
    <h3>景点</h3>
    <div class="filters" role="group" aria-label="按兴趣筛选">${F.map(([w,n])=>`<button data-f="${w}" class="${filter===w?'on':''}" aria-pressed="${filter===w}">${n}<small>${count(w)}</small></button>`).join('')}</div>`;
  s.spots.forEach((p,j)=>{ if(!match(p,filter)) return; const d=D[j];
    h += `<div class="spot" data-j="${j}" tabindex="0">
      <div>${p.geo?'<span class="chip w-geo">地理</span>':''}<span class="chip w-${who(p)}">${WHO[who(p)]}</span><span class="name">${p.name}</span></div>
      <div class="tip">${p.tip}</div>${p.geo?`<div class="geo">${p.geo}</div>`:''}
      <div class="foot2"><span class="dist">${d?(d.km<1?'就在附近':`${d.km} km · ${d.min} 分钟`)+`<span> 离${shortBase(s)}${d.est?'（估）':''}</span>`:''}</span>
        <span class="links"><a class="xhs" href="${xhs(s.city+' '+p.name.replace(/（.*?）/g,''))}" target="_blank" rel="noopener">小红书</a>
        <a href="${nav(s.lnglat,s.name,p.lnglat,p.name)}" target="_blank" rel="noopener">导航</a></span></div></div>`; });
  show(h, s.city+' · 苏州到五指山自驾');
  resetMap(); markActive(s.id);
  const pts = [s.lnglat];
  s.spots.forEach((p,j)=>{ if(!match(p,filter)) return; const d=D[j]; if(!d || d.km<=70) pts.push(p.lnglat);
    const m = L.marker(ll(p.lnglat),{icon:L.divIcon({className:'',html:`<div class="dot" style="background:var(--${p.geo?'geo':who(p)})"></div>`,iconSize:[18,18],iconAnchor:[9,9]}),title:p.name})
      .bindPopup(`<b>${p.name}</b>${d?`<br>${d.km} km · ${d.min} 分钟`:''}`).on('click',()=>hl(j)).addTo(spotLayer); m._j=j; });
  map.flyToBounds(L.latLngBounds(pts.map(ll)),{padding:[40,40],maxZoom:13,duration:.6});
}
function hl(j){ document.querySelectorAll('.spot').forEach(e=>e.classList.toggle('hl',+e.dataset.j===j));
  const el=document.querySelector(`.spot[data-j="${j}"]`); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }

// ---- 日程 ----
function itemTitle(day, it, pos){
  if(it.name) return it.name;
  const [sid,j] = pos.ref.split(':'); return byId[sid].spots[+j].name;
}
function days(focus){
  resetMap(); routeLayer.eachLayer(l=>l.setStyle({opacity:.25}));
  let h = tabs('days') + `<div class="toolbar"><h2>逐日日程</h2><button class="pill" id="print">打印 / 存 PDF</button></div>
    <p class="sub">每天按时间排好；两地之间写了车程，点「导航」直接打开高德。点某一天，地图上就只显示这一天的路线。</p>`;
  SCH.forEach((day,di)=>{
    const g = G.days[day.d] || {pos:[],hops:[]}, dt = dOf(day.d), st = byId[day.at], dd = dayDrive(day.d);
    const hopTo = b => g.hops.find(x=>x.b===b);
    const nameAt = i => i===-1 ? shortBase(byId[di?SCH[di-1].at:'suzhou']) : i===day.items.length ? shortBase(st) : itemTitle(day, day.items[i], g.pos[i]);
    const llAt = i => (i===-1 ? g.start : i===day.items.length ? g.end : g.pos[i]).ll;
    const hopHtml = x => x ? `<div class="hop"><span></span><span></span><span>${x.ferry?'⛴ 轮渡过海':`🚗 ${fmtH(x.min)} · ${x.km} km · <a href="${nav(llAt(x.a),nameAt(x.a),llAt(x.b),nameAt(x.b))}" target="_blank" rel="noopener">导航</a>`}</span></div>` : '';
    let n = 0;
    h += `<section class="day" id="d-${day.d}" data-d="${day.d}"><header><span class="dn">D${di+1}</span><span><span class="dt">${md(dt)} 周${WD[dt.getDay()]}</span> <span class="dc">${st.city.split(' ')[0]}</span></span>
      <span class="sum ${dd.min>=240?'long':''}">🚗 ${fmtH(dd.min)} · ${Math.round(dd.km)} km</span><button class="pill showday" data-showday="${day.d}">🗺 在地图上看这一天</button></header><ol class="items">`;
    if(g.start) h += `<li class="it"><span class="tm"></span><span class="pin none"></span><span class="what" style="color:var(--muted)">从${nameAt(-1)}出发</span></li>` + hopHtml(hopTo(day.items.findIndex((_,i)=>g.pos[i])));
    const fl = day.items.findIndex((_,i)=>g.pos[i]);
    day.items.forEach((it,i)=>{
      const p = g.pos[i]; if(p && !(i===fl && g.start)) h += hopHtml(hopTo(i));
      h += `<li class="it"><span class="tm">${it.t}</span>${p?`<span class="pin">${++n}</span>`:'<span class="pin none"></span>'}
        <span class="what">${it.k==='meet'?'<em class="kmeet">会面</em>':''}<b>${p?itemTitle(day,it,p):it.name}</b>${it.dur?`<small>约 ${fmtH(it.dur)}</small>`:''}${it.note?`<div>${it.note}</div>`:''}</span></li>`;
    });
    if(g.end) h += hopHtml(hopTo(day.items.length)) + `<li class="it"><span class="tm"></span><span class="pin none"></span><span class="what" style="color:var(--muted)">回${nameAt(day.items.length)}</span></li>`;
    h += `</ol></section>`;
  });
  show(h, '日程 · 苏州到五指山自驾');
  $('#print').onclick = () => window.print();
  const target = focus && document.getElementById('d-'+focus);
  if(target){ target.scrollIntoView({block:'start'}); focusDay(focus); } else map.flyToBounds(allBounds(),{padding:[30,30],duration:.6});
}
function focusDay(d){
  document.querySelectorAll('.day').forEach(e=>e.classList.toggle('on',e.dataset.d===d));
  const di = SCH.findIndex(x=>x.d===d), day = SCH[di], g = G.days[d]; if(!g) return;
  spotLayer.clearLayers(); markActive(day.at);
  const pts = [];
  g.hops.forEach(x=>{ L.polyline(x.path.map(ll),{color:css(x.ferry?'ferry':'ink'),weight:4,opacity:.9,dashArray:x.ferry?'6 8':null}).addTo(spotLayer); x.path.forEach(p=>pts.push(p)); });
  let n = 0;
  day.items.forEach((it,i)=>{ const p=g.pos[i]; if(!p) return; n++; pts.push(p.ll);
    L.marker(ll(p.ll),{icon:L.divIcon({className:'',html:`<div class="dmk">${n}</div>`,iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:2000})
      .bindPopup(`<b>${it.t} ${itemTitle(day,it,p)}</b>`).addTo(spotLayer); });
  if(pts.length) map.flyToBounds(L.latLngBounds(pts.map(ll)),{padding:[40,40],maxZoom:13,duration:.6});
}

// ---- 图表 ----
function tipFor(box){
  const tip = document.createElement('div'); tip.className='ttip'; box.appendChild(tip);
  const move = e => { const g=e.target.closest('[data-tip]'); if(!g){ tip.style.opacity=0; return; }
    const r=box.getBoundingClientRect(); tip.innerHTML=g.dataset.tip; tip.style.left=Math.min(Math.max(e.clientX-r.left,70),r.width-70)+'px'; tip.style.top=(e.clientY-r.top-6)+'px'; tip.style.opacity=1; };
  box.addEventListener('pointermove', move);
  box.addEventListener('pointerdown', move);           // 手机上手指按住柱子也能看到提示
  box.addEventListener('pointerleave', ()=>tip.style.opacity=0);
}
function charts(){
  resetMap(); map.flyToBounds(allBounds(),{padding:[30,30],duration:.6});
  const ink = css('ink'), acc = css('accent'), warn = css('warn'), line = css('line');
  // 1. 每天开车多久
  const dd = SCH.map((d,i)=>({d:d.d, i, city:byId[d.at].city.split(' ')[0], ...dayDrive(d.d)}));
  const W=360, H=170, padL=26, padB=22, cw=(W-padL)/dd.length, maxH=5, y=m=>H-padB-(m/60)/maxH*(H-padB-8);
  let c1 = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每天开车时长柱状图">`;
  [0,1,2,3,4,5].forEach(t=>{ c1+=`<line x1="${padL}" x2="${W}" y1="${y(t*60)}" y2="${y(t*60)}" stroke="${line}" stroke-width="1" ${t===4?`stroke-dasharray="4 3" stroke="${warn}"`:''}/><text x="${padL-6}" y="${y(t*60)+4}" text-anchor="end">${t}h</text>`; });
  dd.forEach((x,k)=>{ const bx=padL+k*cw+1.5, bw=Math.max(2,cw-3), top=y(x.min), long=x.min>=240;
    c1+=`<g class="g" data-tip="D${k+1} · ${md(dOf(x.d))} ${x.city}<br>开车 ${fmtH(x.min)} · ${Math.round(x.km)} km" data-go="days/${x.d}">
      <rect class="bar" x="${bx}" y="${top}" width="${bw}" height="${Math.max(0,H-padB-top)}" rx="${Math.min(3,bw/2)}" fill="${long?warn:acc}"/>
      <rect class="hit" x="${padL+k*cw}" y="0" width="${cw}" height="${H-padB}"/>
      ${long?`<text class="lab" x="${bx+bw/2}" y="${top-4}" text-anchor="middle">${(Math.round(x.min/6)/10)}</text>`:''}
      ${k%3===0?`<text x="${bx+bw/2}" y="${H-6}" text-anchor="middle">${md(dOf(x.d))}</text>`:''}</g>`; });
  c1 += `<text x="${padL+3}" y="${y(240)-4}" style="fill:${warn}">4 小时</text></svg>`;
  // 2. 每站住几晚
  const nn = cities.map(s=>({s, n:s.nights}));
  const W2=360, rh=22, H2=nn.length*rh+4, lx=48, mx=Math.max(...nn.map(x=>x.n));
  let c2 = `<svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="每站住几晚条形图">`;
  nn.forEach((x,k)=>{ const yy=k*rh+3, w=x.n/mx*(W2-lx-80);
    c2+=`<g class="g" data-tip="${x.s.city}：${x.n} 晚<br>${x.s.name}" data-go="${x.s.id}"><text x="${lx-6}" y="${yy+13}" text-anchor="end" class="lab">${x.s.city.split(' ')[0]}</text>
      <rect class="bar" x="${lx}" y="${yy+3}" width="${w}" height="13" rx="3" fill="${acc}"/><rect class="hit" x="0" y="${yy}" width="${W2}" height="${rh}"/>
      <text x="${lx+w+6}" y="${yy+14}">${x.n} 晚${x.s.type==='taikang'?' · 泰康':''}</text></g>`; });
  c2 += `</svg>`;
  // 3. 每站景点构成（堆叠）
  const cats = ['elder','young','both'];
  const sc = cities.map(s=>({s, c:Object.fromEntries(cats.map(k=>[k,s.spots.filter(p=>who(p)===k).length])), geo:s.spots.filter(p=>p.geo).length}));
  const mx3 = Math.max(...sc.map(x=>x.s.spots.length)), W3=360, H3=sc.length*rh+4, unit=(W3-lx-56)/mx3;
  let c3 = `<svg viewBox="0 0 ${W3} ${H3}" role="img" aria-label="每站景点按兴趣分类的堆叠条形图">`;
  sc.forEach((x,k)=>{ const yy=k*rh+3; let cx=lx;
    c3+=`<text x="${lx-6}" y="${yy+13}" text-anchor="end" class="lab">${x.s.city.split(' ')[0]}</text>`;
    cats.forEach(cat=>{ const v=x.c[cat]; if(!v) return; const w=v*unit-2;
      c3+=`<g class="g" data-tip="${x.s.city} · ${WHO[cat]}：${v} 个" data-go="${x.s.id}"><rect class="bar" x="${cx}" y="${yy+3}" width="${w}" height="13" rx="3" fill="${css(cat)}"/><rect class="hit" x="${cx}" y="${yy}" width="${v*unit}" height="${rh}"/></g>`; cx+=v*unit; });
    c3+=`<text x="${cx+4}" y="${yy+14}">${x.s.spots.length}${x.geo?` · 地理 ${x.geo}`:''}</text>`; });
  c3 += `</svg>`;
  const totMin = dd.reduce((a,x)=>a+x.min,0), nSpots = cities.reduce((a,s)=>a+s.spots.length,0);
  const table = (head, rows) => `<details><summary>查看数据表</summary><table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></details>`;
  const h = tabs('charts') + `<h2 style="margin-top:14px">图表</h2>
    <div class="stats"><div class="stat"><b>${Math.round(totMin/60)}</b><span>小时开车</span></div><div class="stat"><b>${dd.filter(x=>x.min>=240).length}</b><span>天超过 4 小时</span></div><div class="stat"><b>${nSpots}</b><span>个景点</span></div></div>
    <div class="chart" id="c1"><h3>每天开车多久</h3><p class="cap">包括城际赶路和当天进城玩的往返；超过 4 小时的标成陶土色。点柱子看那一天的日程。</p>${c1}
      ${table(['日期','城市','开车','公里'], dd.map(x=>[md(dOf(x.d)),x.city,fmtH(x.min),Math.round(x.km)]))}</div>
    <div class="chart" id="c2"><h3>每站住几晚</h3><p class="cap">点条形进入那座城市。</p>${c2}
      ${table(['城市','晚数','住处'], nn.map(x=>[x.s.city,x.n,x.s.name]))}</div>
    <div class="chart" id="c3"><h3>每站的景点，按兴趣分</h3>
      <div class="legend2">${cats.map(k=>`<span><i style="background:var(--${k})"></i>${WHO[k]}</span>`).join('')}</div>${c3}
      ${table(['城市',...cats.map(k=>WHO[k]),'地理'], sc.map(x=>[x.s.city,...cats.map(k=>x.c[k]),x.geo]))}</div>`;
  show(h, '图表 · 苏州到五指山自驾');
  ['#c1','#c2','#c3'].forEach(id=>tipFor($(id)));
}

// ---- 路由与事件 ----
const mobile = () => matchMedia('(max-width:820px)').matches;
function show(h, title){
  $('#panel').innerHTML = h; $('#panel').scrollTop = 0; document.title = title;
  const a = location.hash.replace(/^#\/?/,'').split('/')[0], cur = a==='days'||a==='charts' ? a : '';
  document.querySelectorAll('#bnav a').forEach(x=>{ if(x.getAttribute('href')==='#/'+cur) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); });
  if(mobile()) window.scrollTo(0,0);
}
const toMap = () => { window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>{ if(window.scrollY>4) window.scrollTo(0,0); },700); };  // 平滑滚动没生效时直接跳回地图
function go(id){ location.hash = '#/'+(id||''); }
function render(){
  const path = location.hash.replace(/^#\/?/,''), [a,b] = path.split('/');
  if(a==='days') return days(b);
  if(a==='charts') return charts();
  const s = cities.find(c=>c.id===a); s ? city(s) : overview();
}
$('#panel').addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const f = e.target.closest('[data-f]'); if(f){ filter=f.dataset.f; render(); return; }
  const pz = e.target.closest('[data-poster]'); if(pz){ $('#lbimg').src='posters/'+pz.dataset.poster+'.webp'; $('#lbimg').alt=pz.getAttribute('aria-label'); $('#lb').showModal(); return; }
  if(e.target.closest('a')) return;
  const sd = e.target.closest('[data-showday]'); if(sd){ focusDay(sd.dataset.showday); toMap(); return; }
  const dh = e.target.closest('.day'); if(dh){ if(!mobile()) focusDay(dh.dataset.d); return; }
  const sp = e.target.closest('.spot'); if(!sp) return; const j=+sp.dataset.j;
  spotLayer.eachLayer(m=>{ if(m._j===j){ map.flyTo(m.getLatLng(),Math.max(map.getZoom(),13),{duration:.5}); m.openPopup(); } }); hl(j); if(mobile()) toMap();
});
$('#panel').addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.classList.contains('spot')) e.target.click(); });
// 海报弹层：× 按钮、Esc（dialog 自带）、点黑色背景都能关
$('#lbx').onclick = () => $('#lb').close();
$('#lb').addEventListener('click', e=>{ if(e.target.id==='lb') $('#lb').close(); });
window.addEventListener('hashchange', ()=>{ filter='all'; render(); });
$('#tomap').onclick = toMap;
window.addEventListener('scroll', ()=>$('#tomap').classList.toggle('show', mobile() && window.scrollY > $('#map').offsetHeight + 80), {passive:true});
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>map.invalidateSize(),150); });
map.fitBounds(allBounds(),{padding:[30,30]});
render();
})();
</script>
</body>
