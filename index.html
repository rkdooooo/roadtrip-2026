<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>苏州到五指山自驾</title>
<meta name="description" content="2026 年 12 月，从苏州沿海岸线开车回五指山：路线地图、逐日日程、每站景点和图表。">
<meta name="theme-color" content="#efe9e0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232e5b44'/><path d='M9 21c4-1 5-9 8-9s3 6 6 6' stroke='%23efe9e0' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  /* 陶土 · 松绿；类别色已用 dataviz 校验脚本验证（色盲区分、对比度） */
  --bg:#efe9e0; --panel:#f7f3ec; --chip:#e2d9cb; --line:#dcd2c2; --ink:#22261f; --muted:#5f6158;
  --accent:#2e5b44; --taikang:#2e5b44; --hotel:#4a6178; --ferry:#2f7f9a; --home:#b07a1f; --warn:#a8452a;
  --elder:#b0562a; --young:#2a73a8; --both:#8a8a1a; --geo:#2b2b2b;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:180ms;
  --shadow:0 1px 2px rgba(34,38,31,.06),0 6px 20px rgba(34,38,31,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1d19; --panel:#23261f; --chip:#2e3128; --line:#383b32; --ink:#ece6da; --muted:#a5a497;
  --accent:#6fae8c; --taikang:#6fae8c; --hotel:#8fa6c0; --ferry:#6bb5cf; --home:#e0b04a; --warn:#e08a5c;
  --elder:#c9744a; --young:#4f8fcb; --both:#9a9a2e; --geo:#e8e2d6; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:420px 1fr;height:100vh;height:100dvh}
#panel{overflow-y:auto;border-right:1px solid var(--line);padding:0 22px 40px}
#map-shell{min-width:0;min-height:0}
#map{height:100%;background:var(--bg)}
.map-close{display:none}
.date-jump{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px;color:var(--muted)}
.date-jump select{min-height:44px;min-width:0;flex:1;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.it .what{min-width:0;overflow-wrap:anywhere}
.it .place-link{color:var(--accent);display:inline-flex;align-items:center;min-height:44px;padding-inline:6px;margin-inline-start:6px;font-size:14px}
.leaflet-tile-pane{filter:sepia(.16) saturate(.82) contrast(.97)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.8) sepia(.1) saturate(.8)} }
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:26px;line-height:1.25}
h2{font-size:24px;line-height:1.2}
h3{font-size:15px;margin:22px 0 8px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
/* 顶部标签 */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding:14px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.tabs a{flex:1;text-align:center;text-decoration:none;padding:7px 0;border-radius:99px;font-size:14px;color:var(--muted);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.tabs a:hover{background:var(--chip);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent);color:#fff}
.stats{display:flex;gap:8px;margin:16px 0 4px}
.stat{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.stat b{display:block;font:700 20px/1.2 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* 路线列表 */
.route{list-style:none;margin:18px 0 0;padding:0}
.leg{font-size:12.5px;color:var(--muted);padding:3px 0 3px 40px;position:relative;font-variant-numeric:tabular-nums}
.leg::before{content:"";position:absolute;left:15px;top:0;bottom:0;border-left:2px dotted var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0;
  transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
button.row:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
button.row:active{transform:translateY(0) scale(.99)}
.row.plain{background:transparent;border-style:dashed}
.num{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 13px/1 var(--sans)}
.t-taikang{background:var(--taikang)} .t-hotel{background:var(--hotel)} .t-ferry{background:var(--ferry)} .t-home{background:var(--home)}
.row .main{flex:1;min-width:0}
.row .city{font:700 17px/1.3 var(--serif);display:block}
.row .base{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .when{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .when b{display:block;color:var(--ink);font-weight:600}
.chev{color:var(--muted);font-size:20px;line-height:1}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
summary{cursor:pointer;font-family:var(--serif);font-weight:700}
details ul{padding-left:18px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:24px}
/* 城市页 */
.nav{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:8px}
.pill{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;text-decoration:none;transition:border-color var(--dur) var(--ease)}
.pill:hover{border-color:var(--accent)}
.nav .pn{display:flex;gap:6px}
.poster{display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow);background:#000;cursor:zoom-in}
.poster img{display:block;width:100%;height:auto;transition:transform 600ms var(--ease)}
.poster:hover img{transform:scale(1.02)}
.badge{display:inline-block;font:500 11.5px/1.6 var(--sans);padding:0 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:8px;vertical-align:4px}
.status{display:inline-block;font:600 11px/1.7 var(--sans);padding:0 7px;border-radius:99px;background:var(--chip);color:var(--ink);margin-left:6px;vertical-align:2px;white-space:nowrap}
.status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.s-confirmed::before{background:var(--accent)} .s-tentative::before{background:var(--home)} .s-tbd::before{background:var(--warn)} .s-planning::before{background:var(--ferry)} .s-option::before{background:var(--both)}
.legend-status{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;font-size:12px;color:var(--muted)}
.planning{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.planning b{font-family:var(--serif)}
.planning p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:8px 0}
.task .tip{font-size:13.5px;color:var(--muted);margin-top:2px}
.meta{font-size:13.5px;color:var(--muted);margin-top:6px}
.meta div{margin-top:2px}
.note{margin:14px 0 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:13px;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.filters button:hover{border-color:var(--accent)}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters small{opacity:.7;margin-left:4px}
.spot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.spot:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.spot.hl{border-color:var(--accent);box-shadow:var(--shadow)}
.spot .name{font-weight:600}
.spot .tip{font-size:13.5px;color:var(--muted);margin-top:2px}
.spot .tip.park{background:#eef5f1;border-left:3px solid #0f5c46;border-radius:6px;padding:6px 9px;margin-top:6px;color:#24463a}
.spot .tip.park a{color:#0f5c46;font-weight:600}
.geo{font-size:13.5px;border-left:3px solid var(--geo);padding:1px 0 1px 9px;margin:7px 0 2px}
.chip{display:inline-block;font:500 11px/1.65 var(--sans);padding:0 6px;border-radius:4px;color:#fff;margin-right:5px;vertical-align:1px}
.w-elder{background:var(--elder)} .w-young{background:var(--young)} .w-both{background:var(--both)}
.w-geo{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--geo)}
.foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;flex-wrap:wrap}
.dist{font-variant-numeric:tabular-nums}
.dist span{color:var(--muted)}
.links{display:flex;gap:6px}
.links a{text-decoration:none;padding:2px 10px;border-radius:99px;border:1px solid var(--line);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.links a:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.links a.xhs{color:#e0243f} .links a.xhs:hover{background:#e0243f;border-color:#e0243f;color:#fff}
/* 日程 */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin:12px 0;scroll-margin-top:70px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.day.on{border-color:var(--accent);box-shadow:var(--shadow)}
.day header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;cursor:pointer}
.showday{min-height:36px}
.day .dn{font:700 13px/1 var(--sans);color:#fff;background:var(--accent);border-radius:6px;padding:4px 6px;flex:none}
.day .dt{font:700 17px/1.3 var(--serif)}
.day .dc{color:var(--muted);font-size:13px}
.day .sum{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.day .sum.long{color:var(--warn);font-weight:600}
.items{list-style:none;margin:8px 0 0;padding:0}
.it{display:grid;grid-template-columns:44px 22px 1fr;gap:0 8px;align-items:start;padding:5px 0}
.it .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.it .pin{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);color:#fff;background:var(--accent);margin-top:1px}
.it .pin.none{background:transparent;border:2px solid var(--line);width:12px;height:12px;margin:5px 4px 0}
.it .what{font-size:14.5px}
.it .what b{font-weight:600}
.it .what small{color:var(--muted);font-size:12.5px;margin-left:6px}
.it .what div{color:var(--muted);font-size:13px}
.it .kmeet{font-style:normal;font-size:12px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:1px}
.hop{display:grid;grid-template-columns:44px 22px 1fr;gap:0 8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hop span:nth-child(2){border-left:2px dotted var(--line);margin-left:10px;min-height:22px}
.hop a{color:var(--muted)}
/* 图表 */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin:14px 0;position:relative}
.chart h3{margin:0 0 2px}
.chart .cap{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart svg .lab{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{transition:opacity var(--dur) var(--ease)}
.chart svg:hover .bar{opacity:.55}
.chart svg .g:hover .bar{opacity:1}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin:0 0 6px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ttip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12.5px;line-height:1.5;padding:6px 9px;border-radius:8px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity 120ms;z-index:3}
.chart details{margin-top:8px;padding-top:6px;font-size:12.5px}
.chart table{border-collapse:collapse;width:100%;margin-top:6px;font-variant-numeric:tabular-nums}
.chart td,.chart th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
/* 海报弹层 */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(92vw,560px);max-height:92vh;overflow:visible}
dialog.lb::backdrop{background:rgba(0,0,0,.78)}
dialog.lb img{display:block;max-width:100%;max-height:88vh;border-radius:10px}
dialog.lb .x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.4)}
/* 地图标记 */
.mk{border-radius:50%;color:#fff;font:700 12px/1 var(--sans);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.mk.dim{opacity:.45}
.mk.on{transform:scale(1.25)}
#map-shell{position:relative}
.map-marker{display:grid;place-items:center;position:relative}
.map-marker span,.spot-no{display:grid;place-items:center;border-radius:50%;background:#2e5b44;color:#fff;font:700 16px/1 var(--sans)}
.map-marker span{width:36px;height:36px;border:3px solid #fff;box-shadow:0 2px 6px #0007}
.map-marker.history span,.spot-no.history{background:#8b3e1e}
.map-marker.scenic span,.spot-no.scenic{background:#18567c}
.map-marker.home span{background:#5b4b8a}
.map-marker.active span{background:#202823;outline:3px solid #eab85f;scale:1.08}
.spot-no{display:inline-grid;width:25px;height:25px;margin-right:7px;font-size:13px;vertical-align:middle}
.p-badge{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:5px;background:#0f5c46;color:#fff;font:700 11px/18px var(--sans);text-align:center;border:2px solid #fff;font-style:normal;box-shadow:0 1px 3px #0004}
.map-legend{position:absolute;left:12px;top:12px;z-index:800;display:flex;flex-wrap:wrap;gap:4px 10px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font:12.5px/1.5 var(--sans);color:var(--muted);max-width:calc(100% - 70px)}
.map-legend[hidden]{display:none}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.map-legend i.home{background:#5b4b8a}
.map-legend i.spot{background:#2e5b44}
.map-legend i.p{width:13px;height:13px;border-radius:4px;background:#0f5c46}
.pop-d{margin:4px 0 2px;color:#3a3a3a}
.pop-p{background:#eef5f1;border-radius:7px;padding:6px 8px;margin:6px 0 2px;color:#1d3a2d}
.pop-p b{font-family:var(--sans)}
.pop-l{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.map-controls{position:absolute;z-index:900;bottom:28px;left:12px;right:12px;max-width:390px;display:grid;gap:6px;padding:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.map-controls[hidden],.map-controls label[hidden],.map-controls small[hidden]{display:none}
.map-controls label{display:grid;grid-template-columns:4em minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.map-controls select{width:100%;min-height:44px;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.map-controls small{color:var(--muted);line-height:1.35}
.map-popup-link{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.leaflet-popup-content{font:13.5px/1.55 var(--sans);margin:10px 14px}
.leaflet-popup-content b{font-family:var(--serif)}
/* ---- 手机：整页滚动、底部导航、大字号、大按钮 ---- */
.bnav{display:none}
@media (max-width:820px){
  body{font-size:17px;line-height:1.7}
  .app{display:block;height:auto}
  .map-controls{bottom:calc(28px + env(safe-area-inset-bottom))}
  .map-legend{top:calc(64px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));max-width:calc(100% - 24px);font-size:13px}
  #map-shell{visibility:hidden;position:fixed;inset:0;z-index:1100;background:var(--bg)}
  body.map-open{overflow:hidden}
  body.map-open #map-shell{visibility:visible}
  .map-close{display:flex;align-items:center;position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:1001;background:var(--panel);box-shadow:var(--shadow)}
  #map .leaflet-top{top:env(safe-area-inset-top)}
  #map .leaflet-right{right:env(safe-area-inset-right)}
  #map .leaflet-bottom{bottom:env(safe-area-inset-bottom)}
  .poster img{max-height:180px;object-fit:cover}
  .date-jump{font-size:16px}
  #panel{overflow:visible;border:0;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
  .tabs{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
  .bnav a,.bnav button{border:0;background:transparent;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;text-decoration:none;color:var(--muted);font-size:15px;border-radius:12px}
  .bnav a span,.bnav button span{font-size:20px;line-height:1.1}
  .bnav a[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--chip)}
  h1{font-size:26px} h2{font-size:25px} h3{font-size:18px}
  .sub,.meta,.it .what div,.spot .tip,.geo,.day .dc,.hop,.leg,.row .base,.row .when,.foot2,.cap{font-size:15px}
  .stat b{font-size:22px} .stat span{font-size:13px}
  .row{padding:14px 14px;min-height:64px} .row .city{font-size:19px}
  .pill,.filters button,.links a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-size:16px}
  .links{gap:8px}
  .nav{margin:14px 0}
  .spot{padding:14px 15px} .spot .name{font-size:17px}
  .chip{font-size:13px;padding:1px 7px}
  .day{padding:14px 14px 12px;scroll-margin-top:12px}
  .day header{flex-wrap:wrap;row-gap:6px}
  .day .dt{font-size:19px}
  .day .sum{margin-left:0;width:100%;font-size:15px}
  .it{grid-template-columns:50px 26px 1fr;padding:7px 0}
  .it .tm{font-size:15px}
  .it .pin{width:24px;height:24px;font-size:13px}
  .it .what{font-size:17px}
  .hop{grid-template-columns:50px 26px 1fr;padding:2px 0}
  .hop a{display:inline-block;padding:8px 4px;margin:-8px 0}
  .showday{display:inline-flex}
  .it .what small{display:block;margin-left:0;font-size:14px}
  .chart svg text{font-size:12px}
  details{font-size:15px} summary{padding:8px 0}
  dialog.lb{max-width:96vw}
  dialog.lb .x{top:8px;right:8px;width:48px;height:48px;font-size:26px}
  .leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important}
}
@media print{
  .app{display:block;height:auto} #map-shell,.bnav,.date-jump,.tabs,.toolbar button,.showday,.place-link,.poster,.links{display:none!important}
  #panel{overflow:visible;border:0} .day{break-inside:avoid;box-shadow:none}
  body{background:#fff;color:#000}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <main id="panel" aria-live="polite"></main>
  <div id="map-shell">
    <div id="map" role="application" aria-label="行程地图"></div>
    <div class="map-controls" id="map-controls" hidden>
      <label id="map-day-label">看路线<select id="map-day"></select></label>
      <label id="map-point-label">找地点<select id="map-point"><option value="">按编号或名称找地点</option></select></label>
      <small id="map-line-key" hidden>实线：路网估算 · 虚线：轮渡</small>
    </div>
    <div class="map-legend" id="map-legend" hidden></div>
    <button type="button" class="pill map-close" id="map-close">← 返回行程</button>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="页面"><a href="#/"><span>🗺</span>路线</a><a href="#/days"><span>📅</span>日程</a><a href="#/charts"><span>📊</span>图表</a><button type="button" id="map-open" aria-controls="map-shell" aria-expanded="false"><span>📍</span>地图</button></nav>
<dialog class="lb" id="lb" aria-label="城市海报"><button class="x" id="lbx" aria-label="关闭">×</button><img id="lbimg" alt=""></dialog>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="trip-data.js?v=11"></script>
<script src="schedule.js?v=11"></script>
<script src="generated.js?v=11"></script>
<script>
(function(){
const T = window.TRIP, G = window.GEN || {legs:{},dist:{},days:{}}, SCH = window.SCHEDULE || [];
const S = T.stops, $ = s => document.querySelector(s), enc = encodeURIComponent;
const byId = Object.fromEntries(S.map(s=>[s.id,s]));
const WHO = {elder:'历史人文', young:'风景休闲', both:'两者都有'};
const ST = Object.fromEntries((T.statusLegend||[]).map(([k,n,d])=>[k,{n,d}]));
const st = k => ST[k] ? `<span class="status s-${k}" title="${ST[k].d}">${ST[k].n}</span>` : '';
const WD = '日一二三四五六';

// ---- 日期 ----
const start = new Date(T.startDate+'T00:00:00');
const md = d => (d.getMonth()+1)+'/'+d.getDate();
const dOf = str => new Date(str+'T00:00:00');
let off = 0;
S.forEach(s => { s._in = new Date(start); s._in.setDate(start.getDate()+off); off += s.nights||0; s._out = new Date(start); s._out.setDate(start.getDate()+off); });
const end = S[S.length-1]._in;
const stayStops = S.filter(s => (s.nights||0) > 0);
const cities = S.filter(s => s.spots && s.spots.length);
const leg = s => G.legs[s.id] || (s.drive && {km:s.drive.km, h:s.drive.h});
const driveKm = S.reduce((a,s)=>{ const l=G.legs[s.id]; return a + (l && !l.ferry ? l.km : 0); },0);
const dayDrive = d => { const g=G.days[d]; if(!g) return {min:0,km:0}; return g.hops.reduce((a,h)=>h.ferry?a:{min:a.min+h.min,km:a.km+h.km},{min:0,km:0}); };
const fmtH = m => m<60 ? m+' 分钟' : (Math.round(m/6)/10)+' 小时';

// ---- 链接 ----
const xhs = q => `https://www.xiaohongshu.com/search_result?keyword=${enc(q)}`;
const amapQ = q => `https://uri.amap.com/search?keyword=${enc(q)}&callnative=1`;
const shortBase = s => s.type==='taikang' ? s.name.replace('泰康之家·','') : '住处';
const who = p => p.who || 'both';
const match = (p,w) => w==='all' || (w==='geo' ? !!p.geo : who(p)===w || who(p)==='both');

// ---- 地图 ----
const map = L.map('map',{zoomControl:false});
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
const ll = p => [p[1],p[0]];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function fitMap(bounds, options){
  if(reduceMotion.matches || (mobile() && !document.body.classList.contains('map-open'))) {
    map.fitBounds(bounds,{...options,animate:false});
  } else {
    map.flyToBounds(bounds,options);
  }
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();
const routeLayer = L.layerGroup().addTo(map), spotLayer = L.layerGroup().addTo(map), stopMk = {};
S.forEach((s,i)=>{ if(!i) return; const l=G.legs[s.id]; const path=(l&&l.path)||[S[i-1].lnglat,s.lnglat];
  L.polyline(path.map(ll),{color:css(l&&l.ferry?'ferry':'accent'),weight:4,opacity:.85,dashArray:!l?.path||l.ferry?'6 8':null}).addTo(routeLayer); });
S.forEach((s,i)=>{
  const icon = L.divIcon({className:'',html:`<div class="mk t-${s.type}" style="width:28px;height:28px">${s.type==='home'?'家':i}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
  stopMk[s.id] = L.marker(ll(s.lnglat),{icon,zIndexOffset:1000,title:s.city}).addTo(map)
    .on('click',()=> stayStops.includes(s) ? go(s.id) : L.popup().setLatLng(ll(s.lnglat)).setContent(`<b>${s.city}</b><br>${s.name}${s.status?`<br>${ST[s.status]?ST[s.status].n:s.status}`:''}`).openOn(map));
});
function markActive(id){
  Object.entries(stopMk).forEach(([k,m])=>{ const el=m.getElement()&&m.getElement().firstChild; if(!el) return;
    el.classList.toggle('on',k===id); el.classList.toggle('dim',!!id && k!==id); });
}
const allBounds = () => L.latLngBounds(S.map(s=>ll(s.lnglat)));
const pointMarkers = [];
let selectRoute;
function clearPoints(){
  spotLayer.clearLayers();
  pointMarkers.length = 0;
  $('#map-legend').hidden = true;
  refreshPoints();
  map.closePopup();
}
function resetMap(){
  markActive(null);
  clearPoints();
  setMapDays([], null, undefined, '');
  routeLayer.eachLayer(l=>l.setStyle({opacity:.85}));
}
function setMapDays(dates, onSelect, active, overviewLabel){
  selectRoute = onSelect;
  const picker = $('#map-day');
  picker.replaceChildren(new Option(overviewLabel, ''));
  dates.forEach(d=>picker.add(new Option(md(dOf(d))+' · '+byId[SCH.find(day=>day.d===d).at].city, d)));
  picker.value = active || '';
  $('#map-day-label').hidden = !dates.length;
  refreshPoints();
}
function refreshPoints(){
  const picker = $('#map-point');
  picker.replaceChildren(new Option('按编号或名称找地点', ''));
  pointMarkers.forEach(({number,title},i)=>picker.add(new Option(number+' · '+title, String(i))));
  const lots = pointMarkers.map((p,i)=>({p,i})).filter(x=>x.p.parkName);
  if(lots.length){
    const grp = document.createElement('optgroup');
    grp.label = '有停车场的地点';
    lots.forEach(({p,i})=>grp.appendChild(new Option('P · '+p.title+'（'+p.parkName+'）', String(i))));
    picker.appendChild(grp);
  }
  $('#map-point-label').hidden = !pointMarkers.length;
  $('#map-controls').hidden = $('#map-day-label').hidden && !pointMarkers.length;
  $('#map-line-key').hidden = true;
}
function renderLegend(s){
  const el = $('#map-legend');
  if(!s){ el.hidden = true; el.replaceChildren(); return; }
  const hasPark = pointMarkers.some(p=>p.parkName);
  const hasSpots = pointMarkers.some(p=>p.spotIndex!==undefined);
  el.innerHTML = `<span><i class="home"></i>住处</span>${hasSpots?'<span><i class="spot"></i>地点（编号同左侧列表）</span>':''}${hasPark?'<span><i class="p"></i>有停车场（点开看导航）</span>':''}`;
  el.hidden = false;
}
function activatePoint(index){
  $('#map-point').value = String(index);
  pointMarkers.forEach(({marker},i)=>{
    marker.getElement()?.classList.toggle('active',i===index);
    marker.setZIndexOffset(i===index?4000:1800);
  });
}
function addPoint(llPair, number, title, detail, targets, opts={}){
  const {tone='', parkName='', parkFee='', onSelect} = opts;
  const index = pointMarkers.length;
  const links = (targets||[]).map(t=>`<a class="map-popup-link" href="${amapQ(t.q)}" target="_blank" rel="noopener">${t.label}</a>`).join('');
  const html = `<b>${number} · ${title}</b>${detail?`<div class="pop-d">${detail}</div>`:''}${parkName?`<div class="pop-p">🅿️ <b>${parkName}</b>${parkFee?`<br>${parkFee}`:''}</div>`:''}${links?`<div class="pop-l">${links}</div>`:''}`;
  const marker = L.marker(ll(llPair),{
    icon:L.divIcon({className:'map-marker '+tone,html:`<span aria-hidden="true">${number}</span>${parkName?'<i class="p-badge">P</i>':''}`,iconSize:[44,44],iconAnchor:[22,22],popupAnchor:[0,-19],tooltipAnchor:[0,-20]}),
    title, autoPanOnFocus:false, zIndexOffset:1800
  }).bindTooltip(title,{direction:'top'})
    .bindPopup(html,{maxWidth:260})
    .addTo(spotLayer);
  marker.getElement()?.setAttribute('aria-label',number+' '+title);
  marker.on('popupopen',()=>{ activatePoint(index); onSelect?.(); });
  pointMarkers.push({marker,number,title,parkName});
}
function focusPoint(index){
  const point = pointMarkers[index];
  if(!point) return;
  map.setView(point.marker.getLatLng(),Math.max(map.getZoom(),14),{animate:false});
  point.marker.openPopup();
}
$('#map-day').onchange = e => selectRoute?.(e.target.value);
$('#map-point').onchange = e => { if(e.target.value!=='') focusPoint(Number(e.target.value)); };

const tabs = cur => `<nav class="tabs" aria-label="页面">${[['','路线'],['days','日程'],['charts','图表']].map(([h,n])=>`<a href="#/${h}" ${cur===h?'aria-current="page"':''}>${n}</a>`).join('')}</nav>`;

// ---- 路线（总览） ----
function overview(){
  resetMap(); fitMap(allBounds(),{padding:[30,30],duration:.6});
  const [t1,t2] = T.title.split(' · ');
  let h = tabs('') + `<h1>${t1}</h1><div class="sub">${t2?t2+'<br>':''}${start.getFullYear()}.${md(start).replace('/','.')} 出发 · ${end.getFullYear()}.${md(end).replace('/','.')} 过海</div>
    <div class="stats"><div class="stat"><b>${Math.round((end-start)/864e5)+1}</b><span>天</span></div>
      <div class="stat"><b>${Math.round(driveKm)} km</b><span>总里程</span></div>
      <div class="stat"><b>${stayStops.length}</b><span>过夜城市</span></div></div>
    <div class="legend-status">${(T.statusLegend||[]).map(([k,n])=>`<span class="status s-${k}" title="${ST[k]?ST[k].d:''}">${n}</span>`).join('')}</div><ol class="route">`;
  S.forEach((s,i)=>{
    const l = i && leg(s);
    if(l) h += `<li class="leg">${l.ferry?'⛴ 过琼州海峡 · 船上约 1.5–2 小时':`🚗 ${l.km} km · ${l.h} 小时`}</li>`;
    if(s.type==='ferry') return;
    const when = s.nights ? `<b>${md(s._in)} – ${md(s._out)}</b>${s.nights} 晚` : `<b>${md(s._in)}</b>${s.type==='waypoint'?'途经':i?'到家':'出发'}`;
    const inner = `<span class="num t-${s.type}">${s.type==='home'?'家':i}</span><span class="main"><span class="city">${s.city}${st(s.status)}</span><span class="base">${s.name}${s.planning?' · '+s.planning:''}</span></span><span class="when">${when}</span>`;
    h += `<li>${stayStops.includes(s) ? `<button class="row" data-go="${s.id}">${inner}<span class="chev" aria-hidden="true">›</span></button>` : `<div class="row plain">${inner}</div>`}</li>`;
  });
  h += `</ol><details><summary>出发前要知道</summary><ul>${T.assumptions.concat(T.tips).map(t=>`<li>${t}</li>`).join('')}</ul></details>
    ${S.some(x=>x.nav||x.park)?`<details><summary>住处 / 途经点：导航与停车</summary><ul>${S.filter(x=>x.nav||x.park).map(x=>`<li><b>${x.city} · ${x.name}</b>${st(x.status)}：导航「${x.nav}」${x.navll?`（${x.navll[1]}, ${x.navll[0]}）`:''}${x.park?`；停车：${x.park.name}${x.park.fee?`（${x.park.fee}）`:''} · <a href="${amapQ(x.park.nav)}" target="_blank" rel="noopener">高德搜停车场</a>`:''}${x.hours?'；'+x.hours:''}${x.ticket?'；'+x.ticket:''}</li>`).join('')}</ul></details>`:''}
    <div class="foot">路线与车程为 OSRM 路网估算（长途 +15% 余量、城市 +30%），不含实时路况与过路费。厦门、汕头、深圳的日期和住宿已确认，但每日游玩待规划，页面不列早期候选景点。园区 / 景点坐标为公开地图检索参考，请按 POI 名称复核入口与停车收费。底图 © 高德地图。城市海报仿照 maptoposter（MIT）的风格绘制，数据 © OpenStreetMap contributors，瓦片来自 OpenFreeMap。</div>`;
  show(h, '苏州到五指山自驾');
}

// ---- 城市 ----
let filter = 'all';
function city(s){
  const i = S.indexOf(s), ci = stayStops.indexOf(s), prev = stayStops[ci-1], next = stayStops[ci+1];
  const l = leg(s), from = S[i-1], D = G.dist[s.id] || [];
  const count = w => s.spots.filter(p=>match(p,w)).length;
  const F = [['all','全部'],['elder','历史人文'],['young','风景休闲'],['geo','地理']].filter(([w])=>count(w));
  if(!F.some(([w])=>w===filter)) filter='all';
  const nightDays = SCH.filter(d=>d.at===s.id).map(d=>d.d);
  let h = `<div class="nav"><a class="pill" href="#/">← 全程</a><span class="pn">
      ${prev?`<a class="pill" href="#/${prev.id}">‹ ${prev.city}</a>`:''}${next?`<a class="pill" href="#/${next.id}">${next.city} ›</a>`:''}</span></div>
    <button class="poster" data-poster="${s.id}" aria-label="查看${s.city}海报大图"><img src="posters/${s.id}.webp" alt="${s.city}街道海报" width="792" height="1056" onerror="this.parentNode.remove()"></button>
    <h2>${i}. ${s.city}${st(s.status)}${s.planning?st('planning'):''}</h2>
    <div class="meta"><div>${md(s._in)}（周${WD[s._in.getDay()]}）– ${md(s._out)} · ${s.nights} 晚 · ${s.name}</div>
      ${s.lodging?`<div>🛏 住宿：${s.lodging}</div>`:''}
      ${s.addr?`<div>📍 ${s.addr} · <a href="${amapQ(s.nav || s.name)}" target="_blank" rel="noopener">高德搜索</a></div>`:''}
      ${s.nav?`<div>🧭 导航：${s.nav}${s.navll?`（${s.navll[1]}, ${s.navll[0]}）`:''} · <a href="${amapQ(s.nav)}" target="_blank" rel="noopener">高德搜索</a></div>`:''}
      ${s.park?`<div>🅿️ 停车：${s.park.name}${s.park.fee?` · ${s.park.fee}`:''}${s.park.note?` · ${s.park.note}`:''} · <a href="${amapQ(s.park.nav)}" target="_blank" rel="noopener">高德搜停车场</a></div>`:''}
      ${l?`<div>🚗 从${from.city.split(' ')[0]}过来 ${l.km} km · ${l.h} 小时${s.drive&&s.drive.waypoints?' · '+s.drive.via:''} · <a href="${amapQ(s.nav || s.name)}" target="_blank" rel="noopener">高德搜索</a></div>`:''}</div>
    ${s.note&&!s.planning?`<p class="note">${s.note}</p>`:''}
    ${s.planning?`<div class="planning"><b>每日游玩：${s.planning}</b><p>${s.note}</p><p>页面暂不列景点，避免把早期搜集的候选写成确定安排；确定后再补地点、预约和车程。</p></div>`:''}
    ${s.flex&&s.flex.length?`<section class="note"><h3>机动 / 待确认事项</h3>${s.flex.map(f=>`<div class="task"><b>${f.name}</b>${st(f.status)}<div class="tip">${f.note}</div></div>`).join('')}</section>`:''}
    ${nightDays.length?`<p><a class="pill" href="#/days/${nightDays[0]}">看这几天的分时日程 →</a></p>`:''}
    ${s.spots.length?`<h3>已列入的地点</h3>
    <div class="filters" role="group" aria-label="按兴趣筛选">${F.map(([w,n])=>`<button data-f="${w}" class="${filter===w?'on':''}" aria-pressed="${filter===w}">${n}<small>${count(w)}</small></button>`).join('')}</div>`:''}`;
  s.spots.forEach((p,j)=>{ if(!match(p,filter)) return; const d=D[j];
    h += `<div class="spot" data-j="${j}" tabindex="0">
      <div><span class="spot-no ${pointTone(p)}">${j+1}</span>${p.geo?'<span class="chip w-geo">地理</span>':''}<span class="chip w-${who(p)}">${WHO[who(p)]}</span><span class="name">${p.name}</span>${st(p.status)}${p.timing?`<span class="badge">${p.timing}</span>`:''}</div>
      <div class="tip">${p.tip}</div>${p.hours?`<div class="tip">🕒 ${p.hours}</div>`:''}${p.nav?`<div class="tip">🧭 导航：${p.nav}${p.navll?`（${p.navll[1]}, ${p.navll[0]}）`:''} · <a href="${amapQ(p.nav)}" target="_blank" rel="noopener">高德搜索</a></div>`:''}${p.park?`<div class="tip park">🅿️ <b>${p.park.name}</b>${p.park.fee?` · ${p.park.fee}`:''}<br>导航「${p.park.nav}」 · <a href="${amapQ(p.park.nav)}" target="_blank" rel="noopener">高德搜停车场</a>${p.park.note?`<br>${p.park.note}`:''}</div>`:''}${p.ticket?`<div class="tip">🎫 ${p.ticket}</div>`:''}${(p.info||[]).map(t=>`<div class="tip">📌 ${t}</div>`).join('')}${p.url?`<div class="tip"><a href="${p.url}" target="_blank" rel="noopener">查看地点 / 信息来源</a></div>`:''}${p.geo?`<div class="geo">${p.geo}</div>`:''}
      <div class="foot2"><span class="dist">${d?(d.km<1?'就在附近':`${d.km} km · ${d.min} 分钟`)+`<span> 离${shortBase(s)}${d.est?'（估）':''}</span>`:''}</span>
        <span class="links"><a class="xhs" href="${xhs(s.city+' '+p.name.replace(/（.*?）/g,''))}" target="_blank" rel="noopener">小红书</a>
        <a href="${amapQ(p.nav || p.name)}" target="_blank" rel="noopener">高德搜索</a></span></div></div>`; });
  show(h, s.city+' · 苏州到五指山自驾');
  resetMap();
  setMapDays(nightDays, d=> d ? focusDay(d) : cityMap(s), '', '全部景点');
  cityMap(s);
}
function pointTone(p){
  return who(p)==='elder'?'history':who(p)==='young'?'scenic':'';
}
function cityMap(s){
  clearPoints();
  $('#map-day').value = '';
  markActive(s.id);
  routeLayer.eachLayer(l=>l.setStyle({opacity:.18}));
  const pts = [];
  // 住处：单独标记，方便看当天从哪出发
  const homeDetail = [s.addr, s.lodging?`住宿：${s.lodging}`:'', s.park?`🅿️ ${s.park.name}${s.park.fee?` · ${s.park.fee}`:''}`:''].filter(Boolean).join('<br>');
  const homeTargets = [{label:'高德搜住处',q:s.nav||s.name}];
  if(s.park) homeTargets.push({label:'高德搜停车场',q:s.park.nav});
  addPoint(s.lnglat,'住',s.name,homeDetail,homeTargets,{tone:'home'});
  pointMarkers.at(-1).isHome = true;
  pts.push(s.lnglat);   // 与下面一致，最后统一用 ll() 转成 [lat,lng]
  s.spots.forEach((p,j)=>{
    if(!match(p,filter)) return;
    pts.push(p.lnglat);
    const detail = [p.hours?`🕒 ${p.hours}`:'', p.ticket?`🎫 ${p.ticket}`:'', p.tip].filter(Boolean).join('<br>');
    const targets = [{label:'高德搜景点',q:p.nav||p.name}];
    if(p.park) targets.push({label:'高德搜停车场',q:p.park.nav});
    addPoint(p.lnglat,j+1,p.name,detail,targets,{tone:pointTone(p),parkName:p.park?p.park.name:'',parkFee:p.park?p.park.fee:'',onSelect:()=>hl(j)});
    pointMarkers.at(-1).spotIndex = j;
  });
  refreshPoints();
  renderLegend(s);
  fitMap(L.latLngBounds(pts.map(ll)),{paddingTopLeft:[34,64],paddingBottomRight:[34,170],maxZoom:pts.length>1?14:11,duration:.45});
}
function hl(j){
  document.querySelectorAll('.spot').forEach(e=>e.classList.toggle('hl',+e.dataset.j===j));
  const el=document.querySelector(`.spot[data-j="${j}"]`);
  if(el && !document.body.classList.contains('map-open')) el.scrollIntoView({block:'nearest'});
}

// ---- 日程 ----
function itemTitle(day, it, pos){
  if(it.name) return it.name;
  const [sid,j] = pos.ref.split(':'); return byId[sid].spots[+j].name;
}
function days(focus){
  resetMap();
  setMapDays(SCH.map(day=>day.d), d=>{
    if(d) focusDay(d);
    else {
      clearPoints();
      markActive(null);
      routeLayer.eachLayer(l=>l.setStyle({opacity:.85}));
      fitMap(allBounds(),{padding:[35,40],duration:.45});
    }
  }, focus, '全程地图');
  let h = tabs('days') + `<div class="toolbar"><h2>逐日日程</h2><button class="pill" id="print">打印 / 存 PDF</button></div>
    <p class="sub">时间与顺序按状态标注；车程为 OSRM 路网估算，出发前请用高德 / 腾讯地图核对实时路况。点某一天可查看地点。</p>`;
  h += `<label class="date-jump">跳到日期<select id="date-jump"><option value="">选择日期</option>
    ${SCH.map(day=>`<option value="${day.d}" ${day.d===focus?'selected':''}>${md(dOf(day.d))} · ${byId[day.at].city}</option>`).join('')}</select></label>`;
  SCH.forEach((day,di)=>{
    const g = G.days[day.d] || {pos:[],hops:[]}, dt = dOf(day.d), atStop = byId[day.at], dd = dayDrive(day.d);
    const hopTo = b => g.hops.find(x=>x.b===b);
    const nameAt = i => i===-1 ? shortBase(byId[di?SCH[di-1].at:'suzhou']) : i===day.items.length ? shortBase(atStop) : itemTitle(day, day.items[i], g.pos[i]);
    const searchAt = i => {
      const target = i===day.items.length ? atStop : placeFor(g.pos[i]);
      return target?.nav || target?.name || nameAt(i);
    };
    const hopHtml = x => x ? `<div class="hop"><span></span><span></span><span>${x.ferry?'⛴ 轮渡过海':`🚗 ${fmtH(x.min)} · ${x.km} km · <a href="${amapQ(searchAt(x.b))}" target="_blank" rel="noopener">高德搜索</a>`}</span></div>` : '';
    let n = 0;
    h += `<section class="day" id="d-${day.d}" data-d="${day.d}"><header><span class="dn">D${di+1}</span><span><span class="dt">${md(dt)} 周${WD[dt.getDay()]}</span> <span class="dc">${atStop.city.split(' ')[0]}</span>${st(day.status)}</span>
      <span class="sum ${dd.min>=240?'long':''}">开车 ${fmtH(dd.min)} · ${Math.round(dd.km)} km</span><button class="pill showday" data-showday="${day.d}">🗺 在地图上看这一天</button></header>
      ${day.note?`<p class="sub" style="margin:4px 0 0">${day.note}</p>`:''}<ol class="items">`;
    if(g.start) h += `<li class="it"><span class="tm"></span><span class="pin none"></span><span class="what" style="color:var(--muted)">从${nameAt(-1)}出发</span></li>` + hopHtml(hopTo(day.items.findIndex((_,i)=>g.pos[i])));
    const fl = day.items.findIndex((_,i)=>g.pos[i]);
    day.items.forEach((it,i)=>{
      const p = g.pos[i]; if(p && !(i===fl && g.start)) h += hopHtml(hopTo(i));
      h += `<li class="it"><span class="tm">${it.t}</span>${p?`<span class="pin">${++n}</span>`:'<span class="pin none"></span>'}
        <span class="what">${it.k==='meet'?'<em class="kmeet">会面</em>':''}<b>${p?itemTitle(day,it,p):it.name}</b>${p&&searchAt(i)?`<a class="place-link" href="${amapQ(searchAt(i))}" target="_blank" rel="noopener">高德</a>`:''}${it.dur?`<small>约 ${fmtH(it.dur)}</small>`:''}${it.note?`<div>${it.note}</div>`:''}</span></li>`;
    });
    if(g.end) h += hopHtml(hopTo(day.items.length)) + `<li class="it"><span class="tm"></span><span class="pin none"></span><span class="what" style="color:var(--muted)">回${nameAt(day.items.length)}</span></li>`;
    h += `</ol></section>`;
  });
  show(h, '日程 · 苏州到五指山自驾');
  $('#print').onclick = () => window.print();
  $('#date-jump').onchange = e => { if(e.target.value) go('days/'+e.target.value); };
  const target = focus && document.getElementById('d-'+focus);
  if(target){ target.scrollIntoView({block:'start'}); focusDay(focus); } else fitMap(allBounds(),{padding:[30,30],duration:.6});
}
function placeFor(pos){
  const [owner,key] = (pos?.ref || '').split(':');
  return owner==='base' ? byId[key] : byId[owner]?.spots[+key];
}
function focusDay(d){
  const day = SCH.find(x=>x.d===d), g = G.days[d];
  if(!day || !g) return;
  document.querySelectorAll('.day').forEach(e=>e.classList.toggle('on',e.dataset.d===d));
  clearPoints();
  $('#map-day').value = d;
  markActive(day.at);
  routeLayer.eachLayer(l=>l.setStyle({opacity:.12}));
  const pts = [];
  g.hops.forEach(x=>{
    const path = x.path.map(ll);
    const style = {weight:5,opacity:.95,dashArray:x.ferry?'7 8':null,interactive:false};
    L.polyline(path,{...style,color:'#fff',weight:9,dashArray:x.ferry?'7 8':null}).addTo(spotLayer);
    L.polyline(path,{...style,color:x.ferry?'#18799a':'#245f47'}).addTo(spotLayer);
    pts.push(...path);
  });
  // 起点和回程可能是同一个坐标，合并到地图上的同一个标记。
  const places = new Map();
  let n = 0;
  day.items.forEach((it,i)=>{
    const p = g.pos[i];
    if(!p) return;
    const number = ++n, key = p.ll.join(',');
    const title = itemTitle(day,it,p);
    const target = placeFor(p);
    const existing = places.get(key);
    if(existing) {
      existing.number += '·'+number;
      existing.details.push(it.t+' '+title);
    } else {
      places.set(key,{ll:p.ll,number:String(number),title:target?.name || title,details:[it.t+' '+title],destination:target?.nav || target?.name || title,parkName:target?.park?.name || '',parkNav:target?.park?.nav || '',parkFee:target?.park?.fee || ''});
    }
  });
  for(const p of places.values()){
    pts.push(ll(p.ll));
    const targets = [{label:'高德搜地点',q:p.destination}];
    if(p.parkName) targets.push({label:'高德搜停车场',q:p.parkNav});
    addPoint(p.ll,p.number,p.title,p.details.join('<br>'),targets,{parkName:p.parkName,parkFee:p.parkFee});
  }
  refreshPoints();
  $('#map-line-key').hidden = !g.hops.length;
  if(pts.length) fitMap(L.latLngBounds(pts),{paddingTopLeft:[34,58],paddingBottomRight:[34,170],maxZoom:14,duration:.45});
  else fitMap(L.latLngBounds([ll(byId[day.at].lnglat)]),{maxZoom:13,duration:.45});
}

// ---- 图表 ----
function tipFor(box){
  const tip = document.createElement('div'); tip.className='ttip'; box.appendChild(tip);
  const move = e => { const g=e.target.closest('[data-tip]'); if(!g){ tip.style.opacity=0; return; }
    const r=box.getBoundingClientRect(); tip.innerHTML=g.dataset.tip; tip.style.left=Math.min(Math.max(e.clientX-r.left,70),r.width-70)+'px'; tip.style.top=(e.clientY-r.top-6)+'px'; tip.style.opacity=1; };
  box.addEventListener('pointermove', move);
  box.addEventListener('pointerdown', move);           // 手机上手指按住柱子也能看到提示
  box.addEventListener('pointerleave', ()=>tip.style.opacity=0);
}
function charts(){
  resetMap(); fitMap(allBounds(),{padding:[30,30],duration:.6});
  const ink = css('ink'), acc = css('accent'), warn = css('warn'), line = css('line');
  // 1. 每天开车多久
  const dd = SCH.map((d,i)=>({d:d.d, i, city:byId[d.at].city.split(' ')[0], ...dayDrive(d.d)}));
  const W=360, H=170, padL=26, padB=22, cw=(W-padL)/dd.length, maxH=Math.max(5, Math.ceil(Math.max(...dd.map(x=>x.min))/60)), y=m=>H-padB-(m/60)/maxH*(H-padB-16);
  let c1 = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每天开车时长柱状图">`;
  Array.from({length:maxH+1},(_,i)=>i).forEach(t=>{ c1+=`<line x1="${padL}" x2="${W}" y1="${y(t*60)}" y2="${y(t*60)}" stroke="${t===4?warn:line}" stroke-width="1" ${t===4?`stroke-dasharray="4 3"`:''}/><text x="${padL-6}" y="${y(t*60)+4}" text-anchor="end">${t}h</text>`; });
  dd.forEach((x,k)=>{ const bx=padL+k*cw+1.5, bw=Math.max(2,cw-3), top=y(x.min), long=x.min>=240;
    c1+=`<g class="g" data-tip="D${k+1} · ${md(dOf(x.d))} ${x.city}<br>开车 ${fmtH(x.min)} · ${Math.round(x.km)} km" data-go="days/${x.d}">
      <rect class="bar" x="${bx}" y="${top}" width="${bw}" height="${Math.max(0,H-padB-top)}" rx="${Math.min(3,bw/2)}" fill="${long?warn:acc}"/>
      <rect class="hit" x="${padL+k*cw}" y="0" width="${cw}" height="${H-padB}"/>
      ${long?`<text class="lab" x="${bx+bw/2}" y="${top-4}" text-anchor="middle">${(Math.round(x.min/6)/10)}</text>`:''}
      ${k%3===0?`<text x="${bx+bw/2}" y="${H-6}" text-anchor="middle">${md(dOf(x.d))}</text>`:''}</g>`; });
  c1 += `<text x="${padL+3}" y="${y(240)-4}" style="fill:${warn}">4 小时</text></svg>`;
  // 2. 每站住几晚
  const nn = stayStops.map(s=>({s, n:s.nights}));
  const W2=360, rh=22, H2=nn.length*rh+4, lx=48, mx=Math.max(...nn.map(x=>x.n));
  let c2 = `<svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="每站住几晚条形图">`;
  nn.forEach((x,k)=>{ const yy=k*rh+3, w=x.n/mx*(W2-lx-80);
    c2+=`<g class="g" data-tip="${x.s.city}：${x.n} 晚<br>${x.s.name}" data-go="${x.s.id}"><text x="${lx-6}" y="${yy+13}" text-anchor="end" class="lab">${x.s.city.split(' ')[0]}</text>
      <rect class="bar" x="${lx}" y="${yy+3}" width="${w}" height="13" rx="3" fill="${acc}"/><rect class="hit" x="0" y="${yy}" width="${W2}" height="${rh}"/>
      <text x="${lx+w+6}" y="${yy+14}">${x.n} 晚${x.s.type==='taikang'?' · 泰康':''}</text></g>`; });
  c2 += `</svg>`;
  // 3. 每站景点构成（堆叠）
  const cats = ['elder','young','both'];
  const sc = cities.map(s=>({s, c:Object.fromEntries(cats.map(k=>[k,s.spots.filter(p=>who(p)===k).length])), geo:s.spots.filter(p=>p.geo).length}));
  const mx3 = Math.max(...sc.map(x=>x.s.spots.length)), W3=360, H3=sc.length*rh+4, unit=(W3-lx-56)/mx3;
  let c3 = `<svg viewBox="0 0 ${W3} ${H3}" role="img" aria-label="每站景点按兴趣分类的堆叠条形图">`;
  sc.forEach((x,k)=>{ const yy=k*rh+3; let cx=lx;
    c3+=`<text x="${lx-6}" y="${yy+13}" text-anchor="end" class="lab">${x.s.city.split(' ')[0]}</text>`;
    cats.forEach(cat=>{ const v=x.c[cat]; if(!v) return; const w=v*unit-2;
      c3+=`<g class="g" data-tip="${x.s.city} · ${WHO[cat]}：${v} 个" data-go="${x.s.id}"><rect class="bar" x="${cx}" y="${yy+3}" width="${w}" height="13" rx="3" fill="${css(cat)}"/><rect class="hit" x="${cx}" y="${yy}" width="${v*unit}" height="${rh}"/></g>`; cx+=v*unit; });
    c3+=`<text x="${cx+4}" y="${yy+14}">${x.s.spots.length}${x.geo?` · 地理 ${x.geo}`:''}</text>`; });
  c3 += `</svg>`;
  const totMin = dd.reduce((a,x)=>a+x.min,0), nSpots = cities.reduce((a,s)=>a+s.spots.length,0);
  const planningStops = stayStops.filter(s=>s.planning);
  const table = (head, rows) => `<details><summary>查看数据表</summary><table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></details>`;
  const h = tabs('charts') + `<h2 style="margin-top:14px">图表</h2>
    <div class="stats"><div class="stat"><b>${fmtH(totMin)}</b><span>开车时长</span></div><div class="stat"><b>${dd.filter(x=>x.min>=240).length}</b><span>长途天数</span></div><div class="stat"><b>${nSpots}</b><span>个已列地点</span></div></div>
    <div class="chart" id="c1"><h3>每天开车多久</h3><p class="cap">车程为 OSRM 路网估算（长途 +15% 余量），出发前请按实时导航复核。</p>${c1}
      </div>
    <div class="chart" id="c2"><h3>每站住几晚</h3><p class="cap">点条形进入那座城市。</p>${c2}
      ${table(['城市','晚数','住处'], nn.map(x=>[x.s.city,x.n,x.s.name]))}</div>
    <div class="chart" id="c3"><h3>已列入的地点，按兴趣分</h3>
      <p class="cap">${planningStops.length?`${planningStops.map(s=>s.city).join('、')}仍为待规划，未计入本图。`:'只统计当前已列入的地点。'}</p>
      <div class="legend2">${cats.map(k=>`<span><i style="background:var(--${k})"></i>${WHO[k]}</span>`).join('')}</div>${c3}
      ${table(['城市',...cats.map(k=>WHO[k]),'地理'], sc.map(x=>[x.s.city,...cats.map(k=>x.c[k]),x.geo]))}</div>`;
  show(h, '图表 · 苏州到五指山自驾');
  ['#c1','#c2','#c3'].forEach(id=>tipFor($(id)));
}

// ---- 路由与事件 ----
const mobile = () => matchMedia('(max-width:820px)').matches;
function show(h, title){
  $('#panel').innerHTML = h; $('#panel').scrollTop = 0; document.title = title;
  const a = location.hash.replace(/^#\/?/,'').split('/')[0], cur = a==='days'||a==='charts' ? a : '';
  document.querySelectorAll('#bnav a').forEach(x=>{ if(x.getAttribute('href')==='#/'+cur) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); });
  if(mobile()) window.scrollTo(0,0);
}
let mapTrigger;
function toMap(trigger){
  if(!mobile() || document.body.classList.contains('map-open')) return;
  mapTrigger = trigger;
  document.body.classList.add('map-open');
  $('#map-open').setAttribute('aria-expanded','true');
  $('#panel').inert = $('#bnav').inert = true;
  map.invalidateSize({pan:false});
  $('#map-close').focus({preventScroll:true});
}
function closeMap(restoreFocus = true){
  if(!document.body.classList.contains('map-open')) return;
  document.body.classList.remove('map-open');
  $('#map-open').setAttribute('aria-expanded','false');
  $('#panel').inert = $('#bnav').inert = false;
  if(restoreFocus) mapTrigger?.focus({preventScroll:true});
}
$('#map-open').onclick = e => toMap(e.currentTarget);
$('#map-close').onclick = () => closeMap();
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMap(); });
matchMedia('(max-width:820px)').addEventListener('change', e=>{ if(!e.matches) closeMap(false); });
function go(id){ location.hash = '#/'+(id||''); }
function render(){
  const path = location.hash.replace(/^#\/?/,''), [a,b] = path.split('/');
  if(a==='days') return days(b);
  if(a==='charts') return charts();
  const s = stayStops.find(c=>c.id===a); s ? city(s) : overview();
}
$('#panel').addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const f = e.target.closest('[data-f]'); if(f){ filter=f.dataset.f; render(); return; }
  const pz = e.target.closest('[data-poster]'); if(pz){ $('#lbimg').src='posters/'+pz.dataset.poster+'.webp'; $('#lbimg').alt=pz.getAttribute('aria-label'); $('#lb').showModal(); return; }
  if(e.target.closest('a')) return;
  const sd = e.target.closest('[data-showday]'); if(sd){ focusDay(sd.dataset.showday); toMap(sd); return; }
  const dh = e.target.closest('.day'); if(dh){ if(!mobile()) focusDay(dh.dataset.d); return; }
  const sp = e.target.closest('.spot'); if(!sp) return; const j=+sp.dataset.j;
  if(!pointMarkers.some(p=>p.spotIndex===j)) cityMap(byId[location.hash.replace(/^#\/?/,'')]);
  if(mobile()) toMap(sp);
  focusPoint(pointMarkers.findIndex(p=>p.spotIndex===j));
});
$('#panel').addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.classList.contains('spot')) e.target.click(); });
// 海报弹层：× 按钮、Esc（dialog 自带）、点黑色背景都能关
$('#lbx').onclick = () => $('#lb').close();
$('#lb').addEventListener('click', e=>{ if(e.target.id==='lb') $('#lb').close(); });
window.addEventListener('hashchange', ()=>{ closeMap(false); filter='all'; render(); });
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>map.invalidateSize(),150); });
map.fitBounds(allBounds(),{padding:[30,30]});
render();
})();
</script>
